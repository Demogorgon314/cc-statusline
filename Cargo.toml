[package]
name = "cc-statusline"
version = "0.4.0"
edition = "2021"
# File::try_lock
rust-version = "1.89"
description = "High-performance status line for Claude Code, written in Rust"
license = "MIT"
repository = "https://github.com/Demogorgon314/cc-statusline"
readme = "README.md"
keywords = ["claude", "statusline", "claude-code", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cc-statusline"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
unicode-width = "0.2"
ratatui = "0.30"
crossterm = "0.29"
ansi-to-tui = "8"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
